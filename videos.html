<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ဗီဒီယိုများ — YouTube နှင့် TikTok | My Clothing Brand">
  <title>Videos — YouTube & TikTok | My Clothing Brand</title>

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/animations.css">

  <style>
    /* ===== Video Gallery Styles ===== */
    .platform-filters {
      display: flex;
      gap: var(--space-sm);
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: var(--space-xl);
    }

    .platform-filter-btn {
      padding: var(--space-sm) var(--space-lg);
      font-size: var(--text-sm);
      font-weight: var(--fw-medium);
      color: var(--color-text-light);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .platform-filter-btn:hover,
    .platform-filter-btn.active {
      background: var(--color-primary);
      color: var(--color-surface);
      border-color: var(--color-primary);
    }

    .category-filters {
      display: flex;
      gap: var(--space-sm);
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: var(--space-2xl);
    }

    .category-filter-btn {
      padding: var(--space-xs) var(--space-md);
      font-size: var(--text-xs);
      font-weight: var(--fw-medium);
      color: var(--color-text-light);
      background: transparent;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .category-filter-btn:hover,
    .category-filter-btn.active {
      background: var(--color-secondary);
      color: white;
      border-color: var(--color-secondary);
    }

    /* Video Grid */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: var(--space-xl);
    }

    /* Video Card */
    .video-card {
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-md);
      transition: transform var(--transition-base), box-shadow var(--transition-base);
      cursor: pointer;
      position: relative;
    }

    .video-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-lg);
    }

    .video-card__thumbnail {
      position: relative;
      aspect-ratio: 16/9;
      overflow: hidden;
      background: #000;
    }

    /* TikTok Vertical Cards */
    .video-card--tiktok .video-card__thumbnail {
      aspect-ratio: 9/16;
      max-height: 480px;
    }

    .video-card__thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform var(--transition-slow);
    }

    .video-card:hover .video-card__thumbnail img {
      transform: scale(1.05);
    }

    /* Platform Badge */
    .video-card__platform {
      position: absolute;
      top: var(--space-md);
      right: var(--space-md);
      padding: 4px 10px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      border-radius: var(--radius-full);
      color: white;
      font-size: 11px;
      font-weight: var(--fw-semibold);
      display: flex;
      align-items: center;
      gap: 4px;
      z-index: 2;
    }

    .video-card__platform--youtube { background: rgba(255, 0, 0, 0.9); }
    .video-card__platform--tiktok { background: rgba(0, 0, 0, 0.9); }

    /* Play Button */
    .video-card__play {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: rgba(230, 57, 70, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-base);
      pointer-events: none;
      z-index: 2;
    }

    .video-card__play::before {
      content: '';
      width: 0;
      height: 0;
      border-left: 20px solid white;
      border-top: 12px solid transparent;
      border-bottom: 12px solid transparent;
      margin-left: 5px;
    }

    .video-card:hover .video-card__play {
      background: rgba(230, 57, 70, 1);
      transform: translate(-50%, -50%) scale(1.15);
    }

    .video-card__body {
      padding: var(--space-lg);
    }

    .video-card__category {
      display: inline-block;
      padding: 2px 10px;
      background: var(--gradient-gold);
      color: var(--color-primary);
      font-size: 11px;
      font-weight: var(--fw-semibold);
      border-radius: var(--radius-full);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: var(--space-sm);
    }

    .video-card__title {
      font-family: var(--font-heading);
      font-size: var(--text-lg);
      font-weight: var(--fw-semibold);
      color: var(--color-primary);
      margin-bottom: var(--space-xs);
      line-height: 1.3;
    }

    .video-card__desc {
      font-size: var(--text-sm);
      color: var(--color-text-light);
      line-height: 1.6;
    }

    /* ===== Video Modal ===== */
    .video-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: var(--space-lg);
      animation: fadeIn 0.3s ease;
    }

    .video-modal.active {
      display: flex;
    }

    .video-modal__content {
      position: relative;
      width: 100%;
      max-width: 1000px;
      background: #000;
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    }

    .video-modal__content--youtube {
      aspect-ratio: 16/9;
    }

    .video-modal__content--tiktok {
      aspect-ratio: 9/16;
      max-width: 420px;
      max-height: 85vh;
    }

    .video-modal__content iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .video-modal__close {
      position: absolute;
      top: -50px;
      right: 0;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: none;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background var(--transition-fast);
      z-index: 10;
    }

    .video-modal__close:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (max-width: 768px) {
      .video-grid {
        grid-template-columns: 1fr;
        gap: var(--space-lg);
      }

      .video-modal__close {
        top: -45px;
      }

      .video-modal__content--tiktok {
        max-width: 100%;
      }
    }

    .empty-state {
      text-align: center;
      padding: var(--space-4xl) var(--space-xl);
      grid-column: 1 / -1;
    }

    .empty-state__icon {
      font-size: 4rem;
      margin-bottom: var(--space-lg);
    }
  </style>
</head>
<body>

  <!-- ===== Header ===== -->
  <header class="header" id="header">
    <div class="header__inner">
      <a href="index.html" class="logo">
        <span class="logo__icon">🧵</span>

      </a>

      <button class="menu-toggle" id="menuToggle" aria-label="Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="nav" id="nav">
        <a href="index.html" class="nav__link">Home</a>
        <a href="products.html" class="nav__link">Products</a>
        <a href="gallery.html" class="nav__link">Gallery</a>
        <a href="videos.html" class="nav__link active">Videos</a>
        <a href="about.html" class="nav__link">About</a>
        <a href="contact.html" class="nav__link">Contact</a>
      </nav>
    </div>
  </header>

  <!-- ===== Video Gallery Section ===== -->
  <section class="section">
    <div class="container">
      <div class="section-title">

        <p class="subtitle">YouTube နှင့် TikTok မှ ဗီဒီယိုများ</p>

      <!-- Platform Filter -->
      <div class="platform-filters" id="platformFilters">
        <button class="platform-filter-btn active" data-platform="all">
          🎬 အားလုံး
        </button>
        <button class="platform-filter-btn" data-platform="youtube">
          ▶️ YouTube
        </button>
        <button class="platform-filter-btn" data-platform="tiktok">
          🎵 TikTok
        </button>
      </div>

      <!-- Category Filter -->
      <div class="category-filters" id="categoryFilters">
        <button class="category-filter-btn active" data-category="all">အားလုံး</button>
        <button class="category-filter-btn" data-category="product">Product Demo</button>
        <button class="category-filter-btn" data-category="behind">Behind the Scenes</button>

  <!-- ===== Video Modal ===== -->
  <div class="video-modal" id="videoModal">

      <button class="video-modal__close" id="videoModalClose" aria-label="Close">×</button>

  <!-- ===== Scripts ===== -->

</body>
