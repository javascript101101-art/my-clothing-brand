<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videos — My Clothing Brand</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <header class="header" id="header">
    <div class="header__inner">
      <a href="index.html" class="logo">
        <span class="logo__icon">🧵</span>
        <span>My Brand</span>
      </a>
      <button class="menu-toggle" id="menuToggle" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav" id="nav">
        <a href="index.html" class="nav__link">Home</a>
        <a href="products.html" class="nav__link">Products</a>
        <a href="gallery.html" class="nav__link">Gallery</a>
        <a href="videos.html" class="nav__link active">Videos</a>
        <a href="about.html" class="nav__link">About</a>
        <a href="contact.html" class="nav__link">Contact</a>
      </nav>
    </div>
  </header>

  <section class="section">
    <div class="container">
      <div class="section-title">
        <h2>ဗီဒီယိုများ</h2>
        <p class="subtitle">Product Demo နှင့် Behind the Scenes</p>
      </div>

      <div class="video-grid">
        <!-- Video 1 -->
        <div class="video-wrapper">
          <iframe
            src="https://www.youtube.com/embed/VIDEO_ID_1"
            title="Product Demo"
            loading="lazy"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen>
          </iframe>
        </div>

        <!-- Video 2 -->
        <div class="video-wrapper">
          <iframe
            src="https://www.youtube.com/embed/VIDEO_ID_2"
            title="Behind the Scenes"
            loading="lazy"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen>
          </iframe>
        </div>

        <!-- Video 3 -->
        <div class="video-wrapper">
          <iframe
            src="https://www.youtube.com/embed/VIDEO_ID_3"
            title="Collection Showcase"
            loading="lazy"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen>
          </iframe>
        </div>
      </div>

      <div class="text-center mt-xl">
        <a href="https://youtube.com/@yourbrand" target="_blank" rel="noopener" class="btn btn--primary">
          ▶️ YouTube Channel ကြည့်ရန်
        </a>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer__bottom" style="border: none;">
        © 2026 My Clothing Brand. All rights reserved.
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
