  <style>
    /* ===== Product Detail Page Styles ===== */
    .product-detail {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-3xl);
      align-items: start;
      padding: var(--space-2xl) 0;
    }

    @media (max-width: 768px) {
      .product-detail {
        grid-template-columns: 1fr;
        gap: var(--space-xl);
      }
    }

    /* Image Gallery */
    .product-gallery__main {
      aspect-ratio: 3/4;
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: var(--color-bg);
      box-shadow: var(--shadow-md);
    }

    .product-gallery__main img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-gallery__thumbs {
      display: flex;
      gap: var(--space-sm);
      margin-top: var(--space-md);
    }

    .product-gallery__thumb {
      width: 70px;
      height: 70px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color var(--transition-fast);
      background: var(--color-bg);
    }

    .product-gallery__thumb.active,
    .product-gallery__thumb:hover {
      border-color: var(--color-secondary);
    }

    .product-gallery__thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Product Info */
    .product-info__badge {
      display: inline-block;
      padding: var(--space-xs) var(--space-md);
      background: var(--color-accent);
      color: white;
      font-size: var(--text-xs);
      font-weight: var(--fw-semibold);
      border-radius: var(--radius-full);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: var(--space-md);
    }

    .product-info__title {
      font-size: var(--text-3xl);
      margin-bottom: var(--space-sm);
      color: var(--color-primary);
    }

    .product-info__price {
      font-size: var(--text-2xl);
      font-weight: var(--fw-bold);
      color: var(--color-secondary);
      margin-bottom: var(--space-lg);
    }

    .product-info__desc {
      font-size: var(--text-base);
      line-height: 1.8;
      color: var(--color-text-light);
      margin-bottom: var(--space-xl);
    }

    .product-info__meta {
      border-top: 1px solid var(--color-border);
      border-bottom: 1px solid var(--color-border);
      padding: var(--space-lg) 0;
      margin-bottom: var(--space-xl);
    }

    .product-info__meta-row {
      display: flex;
      gap: var(--space-sm);
      margin-bottom: var(--space-sm);
      font-size: var(--text-sm);
    }

    .product-info__meta-row:last-child {
      margin-bottom: 0;
    }

    .product-info__meta-label {
      font-weight: var(--fw-semibold);
      color: var(--color-primary);
      min-width: 100px;
    }

    .product-info__meta-value {
      color: var(--color-text-light);
    }

    /* Size / Color Options */
    .product-options {
      margin-bottom: var(--space-xl);
    }

    .product-options__label {
      font-size: var(--text-sm);
      font-weight: var(--fw-semibold);
      color: var(--color-primary);
      margin-bottom: var(--space-sm);
      display: block;
    }

    .product-options__list {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-sm);
      margin-bottom: var(--space-lg);
    }

    .product-options__item {
      padding: var(--space-sm) var(--space-md);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      font-size: var(--text-sm);
      cursor: pointer;
      transition: all var(--transition-fast);
      background: var(--color-surface);
      color: var(--color-text);
    }

    .product-options__item:hover,
    .product-options__item.active {
      border-color: var(--color-primary);
      background: var(--color-primary);
      color: var(--color-surface);
    }

    /* Action Buttons */
    .product-actions {
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .product-actions__primary {
      display: flex;
      gap: var(--space-md);
    }

    .product-actions__primary .btn {
      flex: 1;
    }

    /* Loading / Error States */
    .state-box {
      text-align: center;
      padding: var(--space-4xl) var(--space-xl);
    }

    .state-box__icon {
      font-size: 4rem;
      margin-bottom: var(--space-lg);
    }

    .state-box h2 {
      margin-bottom: var(--space-md);
    }

    .state-box p {
      margin-bottom: var(--space-xl);
      color: var(--color-text-light);
    }

    /* Breadcrumb */
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      padding: var(--space-lg) 0;
    }

    .breadcrumb a {
      color: var(--color-text-light);
      transition: color var(--transition-fast);
    }

    .breadcrumb a:hover {
      color: var(--color-secondary);
    }

    .breadcrumb__sep {
      color: var(--color-text-muted);
    }
  </style>
