<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery — My Clothing Brand</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/animations.css">  
  <style>
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: var(--space-md);
    }
    .gallery-item {
      aspect-ratio: 1;
      overflow: hidden;
      border-radius: var(--radius-md);
      cursor: pointer;
      position: relative;
    }
    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform var(--transition-slow);
    }
    .gallery-item:hover img {
      transform: scale(1.08);
    }
    .gallery-item::after {
      content: '🔍';
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.4);
      opacity: 0;
      font-size: 2rem;
      transition: opacity var(--transition-base);
    }
    .gallery-item:hover::after {
      opacity: 1;
    }
  </style>
</head>
<body>

  <header class="header" id="header">
    <div class="header__inner">
      <a href="index.html" class="logo">
        <span class="logo__icon">🧵</span>
        <span>My Brand</span>
      </a>
      <button class="menu-toggle" id="menuToggle" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav" id="nav">
        <a href="index.html" class="nav__link">Home</a>
        <a href="products.html" class="nav__link">Products</a>
        <a href="gallery.html" class="nav__link active">Gallery</a>
        <a href="videos.html" class="nav__link">Videos</a>
        <a href="about.html" class="nav__link">About</a>
        <a href="contact.html" class="nav__link">Contact</a>
      </nav>
    </div>
  </header>

  <section class="section">
    <div class="container">
      <div class="section-title">
        <h2>Photo Gallery</h2>
        <p class="subtitle">ကျွန်ုပ်တို့၏ လက်ရာများ</p>
      </div>

      <div class="gallery-grid">
        <div class="gallery-item"><img src="assets/images/products/product-1.jpg" alt="Gallery 1" loading="lazy"></div>
        <div class="gallery-item"><img src="assets/images/products/product-2.jpg" alt="Gallery 2" loading="lazy"></div>
        <div class="gallery-item"><img src="assets/images/products/product-3.jpg" alt="Gallery 3" loading="lazy"></div>
        <div class="gallery-item"><img src="assets/images/products/product-4.jpg" alt="Gallery 4" loading="lazy"></div>
        <div class="gallery-item"><img src="assets/images/products/product-5.jpg" alt="Gallery 5" loading="lazy"></div>
        <div class="gallery-item"><img src="assets/images/products/product-6.jpg" alt="Gallery 6" loading="lazy"></div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer__bottom" style="border: none;">
        © 2026 My Clothing Brand. All rights reserved.
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/animations.js"></script>
</body>
</html>
